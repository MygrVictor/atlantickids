<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Atlantic Kids</title>
    <style>
      :root {
        --w: min(52vw, 380px);
        --step: 0.35px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: var(--w);
        aspect-ratio: 3068 / 1390;
        perspective: 1500px;
      }
      /* ombre au sol */
      .stage::after {
        content: "";
        position: absolute;
        left: 2%;
        right: 2%;
        bottom: -55px;
        height: 44px;
        border-radius: 50%;
        filter: blur(6px);
        z-index: -1;
        background: radial-gradient(
          closest-side,
          rgba(0, 0, 0, 0.38),
          transparent
        );
      }
      /* logo 3D : 19 couches empilées en profondeur, qui tournent ensemble */
      .logo {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        animation: spin 20s linear infinite;
        /* pas de filter ici : il aplatit la 3D (annule preserve-3d) */
      }
      .logo svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform: translateZ(calc((var(--i) - 60) * var(--step)));
      }
      .logo svg.face use {
        filter: url(#metal);
      }
      @keyframes spin {
        from {
          transform: rotateY(0);
        }
        to {
          transform: rotateY(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo {
          animation: sway 8s ease-in-out infinite alternate;
        }
        @keyframes sway {
          from {
            transform: rotateY(-18deg);
          }
          to {
            transform: rotateY(18deg);
          }
        }
      }
    </style>
  </head>

          result="spark"
        >
          <fePointLight x="1500" y="-700" z="700" />
        </feSpecularLighting>
        <feComposite
          in="spark"
          in2="SourceAlpha"
          operator="in"
          result="sparkIn"
        />

        <!-- assemblage : couleur ombrée + paillettes + vernis + éclat -->
        <feComposite
          in="shaded"
          in2="flakesIn"
          operator="arithmetic"
          k1="0"
          k2="1"
          k3="0.14"
          k4="0"
          result="paint"
        />
        <feComposite
          in="paint"
          in2="glossIn"
          operator="arithmetic"
          k1="0"
          k2="1"
          k3="0.45"
          k4="0"
          result="varnish"
        />
        <feComposite
          in="varnish"
          in2="sparkIn"
          operator="arithmetic"
          k1="0"
          k2="1"
          k3="1.3"
          k4="0"
          result="lit"
        />
        <feComposite in="lit" in2="SourceAlpha" operator="in" />
      </filter>

      <!-- reflets de lumière : bandes blanches diagonales qui balaient les lettres -->
      <linearGradient
        id="streak"
        gradientUnits="userSpaceOnUse"
        x1="0"
        y1="0"
        x2="1400"
        y2="1390"
      >
        <stop offset="0" stop-color="#fff" stop-opacity="0" />
        <stop offset="0.30" stop-color="#fff" stop-opacity="0" />
        <stop offset="0.38" stop-color="#fff" stop-opacity="0.95" />
        <stop offset="0.44" stop-color="#fff" stop-opacity="0" />
        <stop offset="0.52" stop-color="#fff" stop-opacity="0" />
        <stop offset="0.55" stop-color="#fff" stop-opacity="0.6" />
        <stop offset="0.58" stop-color="#fff" stop-opacity="0" />
        <stop offset="1" stop-color="#fff" stop-opacity="0" />
        <animateTransform
          attributeName="gradientTransform"
          type="translate"
          values="-2600 0; 3600 0; 3600 0"
          keyTimes="0; 0.55; 1"
          dur="5s"
          repeatCount="indefinite"
        />
      </linearGradient>
      <mask id="logoMask" style="mask-type: alpha">
        <use href="#c" width="3068" height="1390" />
      </mask>
    </svg>

    <div class="stage" role="img" aria-label="Logo Atlantic Kids">
      <div class="logo" id="logo"></div>
    </div>

    <script>
      // 27 couches : face avant et arrière en couleur, tranches en version foncée
      var N = 121,
        box = document.getElementById("logo"),
        h = "";
      for (var i = 0; i < N; i++) {
        var end = i === 0 || i === N - 1;
        h +=
          '<svg class="' +
          (end ? "face" : "edge") +
          '" viewBox="0 0 3068 1390" style="--i:' +
          i +
          '" aria-hidden="true">' +
          '<use href="#' +
          (end ? "c" : "d") +
          '" width="3068" height="1390"/>' +
          (end
            ? '<rect width="3068" height="1390" fill="url(#streak)" mask="url(#logoMask)"/>'
            : "") +
          "</svg>";
      }
      box.innerHTML = h;
    </script>
  </body>
</html>
